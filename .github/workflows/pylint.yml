name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint black isort autoflake

    - name: Auto-fix formatting & unused code
      run: |
        autoflake --remove-all-unused-imports --remove-unused-variables -r -i .
        isort .
        black .

    - name: Run pylint (fail only on real issues)
      run: |
        pylint --fail-under=9.0 $(git ls-files '*.py')
